name: Apply to the v0.1 reviewer fixture
description: Application template for the retained adjudication calibration pool.
title: "[reviewer] "
labels: ["reviewer-application"]
body:
  - type: markdown
    attributes:
      value: |
        This template belongs to the retained v0.1 adjudication fixture, not the
        v0.6 hub admission flow. Do not post identity documents or sensitive
        personal data. It uses self-declared controller and affiliation
        information, not proof of personhood.
  - type: input
    id: key
    attributes:
      label: Ed25519 public key
      placeholder: "ed25519:..."
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Stable controller label
      description: Used only to avoid assigning declared common controllers together.
    validations:
      required: true
  - type: textarea
    id: expertise
    attributes:
      label: Relevant expertise and evidence
    validations:
      required: true
  - type: textarea
    id: affiliation
    attributes:
      label: Affiliations and conflicts
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Review rules
      options:
        - label: I will review independently and commit before reveal.
          required: true
        - label: I will disclose common control and case-specific conflicts.
          required: true
        - label: I understand this fixture requires calibration and is clerk-controlled.
          required: true
