name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.9.5

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked-environment tool
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Validate and sync lockfile
        run: |
          uv lock --check
          uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - name: Lint and format check
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Reject secrets outside the reviewed baseline
        run: |
          git ls-files -z | xargs -0 uv run --frozen detect-secrets-hook \
            --no-verify --baseline .secrets.baseline
      - name: Verify the shareable Git archive
        shell: bash
        run: |
          archive_root="$(mktemp -d)"
          trap 'find "${archive_root}" -xdev -depth -delete' EXIT
          git archive HEAD | tar -x -C "${archive_root}"
          test -f "${archive_root}/SECURITY.md"
          test -x "${archive_root}/deploy/preflight.sh"
          test -f "${archive_root}/compose.github-auto.yml"
          test ! -e "${archive_root}/.git"
          test ! -e "${archive_root}/demo-output"
          test ! -e "${archive_root}/knowledge"
          test -z "$(find "${archive_root}" -type f \
            \( -name '.env' -o -name '*.pem' -o -name '*.key' \
            -o -name '*.p12' -o -name '*.pfx' -o -name '*.jks' \
            -o -name '*.keystore' \) -print -quit)"
      - name: Test
        run: uv run --frozen pytest
      - name: Build distributions
        run: uv build
      - name: Verify installed wheel and bundled UI
        shell: bash
        run: |
          smoke_root="$(mktemp -d)"
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${wheel_path}"
          test -n "${sdist_path}"
          tar -tzf "${sdist_path}" >"${smoke_root}/sdist-files.txt"
          grep -q '/docs/README.md$' "${smoke_root}/sdist-files.txt"
          grep -q '/tests/fixtures/conjectures/erdos686-formalized.html$' \
            "${smoke_root}/sdist-files.txt"
          grep -q '/.secrets.baseline$' "${smoke_root}/sdist-files.txt"
          uv venv --python "${{ matrix.python-version }}" "${smoke_root}/venv"
          uv pip install --python "${smoke_root}/venv/bin/python" "${wheel_path}"
          "${smoke_root}/venv/bin/boule" --help >/dev/null
          "${smoke_root}/venv/bin/python" - <<'PY'
          from importlib.resources import files

          web = files("boule").joinpath("web")
          required = ("index.html", "styles.css", "app.js", "favicon.svg", "docs.html", "llms.txt")
          assert all(web.joinpath(name).is_file() for name in required)
          PY

  container:
    name: Container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image from the frozen lockfile
        run: docker build --tag boule-ci .
      - name: Validate safe and automated Compose overlays
        env:
          BOULE_GITHUB_ORG: BouleProtocol
          BOULE_GITHUB_APP_ID: "1"
          BOULE_GITHUB_INSTALLATION_ID: "1"
          BOULE_GITHUB_APP_KEY_HOST_PATH: /tmp/synthetic-github-app.pem
        run: |
          docker compose -f compose.staging.yml config --quiet
          docker compose -f compose.staging.yml -f compose.github.yml config --quiet
          docker compose -f compose.staging.yml -f compose.github-auto.yml config --quiet
      - name: Exercise deployment preflight with a synthetic App key
        shell: bash
        run: |
          preflight_root="$(mktemp -d)"
          trap 'sudo find "${preflight_root}" -xdev -depth -delete' EXIT
          openssl genrsa -out "${preflight_root}/source.pem" 2048 >/dev/null 2>&1
          sudo install -d -o 10001 -g 10001 -m 0700 "${preflight_root}/secrets"
          sudo install -o 10001 -g 10001 -m 0600 \
            "${preflight_root}/source.pem" "${preflight_root}/secrets/github-app.pem"
          install -m 0600 .env.example "${preflight_root}/boule.env"
          sed -i 's/^BOULE_GITHUB_ORG=.*/BOULE_GITHUB_ORG=BouleProtocol/' \
            "${preflight_root}/boule.env"
          sed -i 's/^BOULE_GITHUB_APP_ID=.*/BOULE_GITHUB_APP_ID=1/' \
            "${preflight_root}/boule.env"
          sed -i 's/^BOULE_GITHUB_INSTALLATION_ID=.*/BOULE_GITHUB_INSTALLATION_ID=1/' \
            "${preflight_root}/boule.env"
          sed -i \
            "s|^BOULE_GITHUB_APP_KEY_HOST_PATH=.*|BOULE_GITHUB_APP_KEY_HOST_PATH=${preflight_root}/secrets/github-app.pem|" \
            "${preflight_root}/boule.env"
          sudo ./deploy/preflight.sh "${preflight_root}/boule.env"
      - name: Verify entry point and non-root runtime
        run: |
          docker run --rm boule-ci --help >/dev/null
          test "$(docker run --rm --entrypoint id boule-ci -u)" = "10001"
          docker run --rm --mount type=volume,destination=/data \
            boule-ci registry init /data --json >/dev/null
