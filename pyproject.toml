[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boule-protocol"
version = "0.6.0"
description = "Open-source protocol for durable, auditable research across people and AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daryxx", email = "xxyrad@proton.me" }]
keywords = ["agents", "attribution", "bounties", "collaboration", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=44,<48",
  "rich>=14,<15",
]

[project.urls]
Documentation = "https://github.com/BouleProtocol/boule-protocol/tree/main/docs"
Issues = "https://github.com/BouleProtocol/boule-protocol/issues"
Repository = "https://github.com/BouleProtocol/boule-protocol"

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
boule = "boule.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boule = ["web/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
